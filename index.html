<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotto Luck - Number Generator</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">
</head>
<body data-theme="dark">
    <div class="app-wrapper">
        <!-- Theme Toggle -->
        <div class="theme-toggle">
            <button id="theme-btn">☀️ Light Mode</button>
        </div>

        <!-- Landing Screen -->
        <section id="landing-screen" class="screen">
            <div class="content">
                <h1 class="hero-title">Lotto Luck</h1>
                <p class="hero-subtitle">Test your fortune today</p>
                <div class="button-group">
                    <button id="enter-btn" class="glow-button">Enter Experience</button>
                    <button id="partnership-btn" class="secondary-button">Partnership Inquiry</button>
                </div>
            </div>
        </section>

        <!-- Partnership Screen -->
        <section id="partnership-screen" class="screen hidden">
            <div class="content">
                <h2 class="section-title">Partnership</h2>
                <form id="partnership-form" action="https://formspree.io/f/mjgzjlon" method="POST" class="contact-form">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" name="name" id="name" placeholder="John Doe" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" name="email" id="email" placeholder="john@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea name="message" id="message" placeholder="How can we help you?" required></textarea>
                    </div>
                    <button type="submit" id="submit-btn" class="action-button">Send Message</button>
                    <div id="form-status" class="form-status"></div>
                </form>
                <button id="close-partnership-btn" class="text-button">← Back to Home</button>
            </div>
        </section>

        <!-- Generator Screen -->
        <section id="generator-screen" class="screen hidden">
            <div class="content">
                <h2 class="section-title">Fortune Generator</h2>
                <div class="control-panel">
                    <button id="generator-btn" class="action-button">Generate Numbers</button>
                </div>
                <div id="lotto-numbers-container" class="ball-container"></div>
                <button id="back-btn" class="text-button">← Back to Home</button>
            </div>
        </section>
    </div>
    <script src="main.js"></script>
</body>
</html>
